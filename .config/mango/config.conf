# More option see https://github.com/DreamMaoMao/mango/wiki/

source=./inputs.conf
source=./effects.conf
source=./layouts.conf
source=./binds.conf

exec=swaybg -c 4c7273
# exec=systemctl --user restart mango-waybar.service
exec=systemctl --user restart vibepanel.service

# Appearance
gappih=4
gappiv=4
gappoh=4
gappov=4
borderpx=2
border_radius=0
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

# Background color of the root window
rootcolor=0x201b14ff
# Inactive window border
bordercolor=0x1d1f21ff
# Active window border
# focuscolor=0xf0c674ff
focuscolor=0x81a2beff
# Urgent window border (alerts)
urgentcolor=0xad401fff
# Drop shadow when dragging windows
dropcolor=0x8FBA7C55
# state colors
scratchpadcolor=0x81a2beff
globalcolor=0xb153a7ff
maximizescreencolor=x0x89aa61ff
overlaycolor=0x14a57cff

# scratchpad settings
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9

# Overview Setting
hotarea_size=10
enable_hotarea=1
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc
tag_carousel=1
no_border_when_single=1
axis_bind_apply_timeout=100
focus_on_activate=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1
